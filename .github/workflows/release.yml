name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/jarvis_voice/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Zip the integration for manual installs
        run: cd custom_components/jarvis_voice && zip -r "$GITHUB_WORKSPACE/jarvis_voice.zip" . -x '__pycache__/*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jarvis_voice.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
